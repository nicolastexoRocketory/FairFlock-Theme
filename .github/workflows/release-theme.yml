name: Release FairFlock Theme

# Baut das Theme-ZIP bei Tags / manuell.
# Live-Deploy: workflow_dispatch mit dry_run=false + Secrets (siehe ops/DEPLOY.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur paketieren / Deploy-Dry-Run (kein Schreiben auf Shops)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    name: Package theme
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip_name: ${{ steps.meta.outputs.zip_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          VERSION="$(grep -E '^Version:' style.css | head -1 | awk '{print $2}')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=fairflock-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "Theme version: ${VERSION}"

      - name: Build ZIP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync zip
          ./ops/scripts/package-theme.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fairflock-theme
          path: dist/${{ steps.meta.outputs.zip_name }}
          if-no-files-found: error

  deploy:
    name: Deploy to shops (Mittwald)
    needs: package
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ZIP
        uses: actions/download-artifact@v4
        with:
          name: fairflock-theme
          path: dist

      - name: Install mittwald CLI
        run: |
          # Binary-Asset-Namen enthalten Version+Hash — npm ist der stabile Linux-Weg.
          npm install -g @mittwald/cli
          mw --version

      - name: Write registry from secret
        env:
          SHOPS_REGISTRY_JSON: ${{ secrets.SHOPS_REGISTRY_JSON }}
        run: |
          if [[ -z "${SHOPS_REGISTRY_JSON}" ]]; then
            echo "Secret SHOPS_REGISTRY_JSON fehlt — nutze ops/shops.registry.example.json"
            cp ops/shops.registry.example.json ops/shops.registry.json
          else
            printf '%s\n' "$SHOPS_REGISTRY_JSON" > ops/shops.registry.json
          fi

      - name: Setup SSH key
        env:
          MITTWALD_SSH_PRIVATE_KEY: ${{ secrets.MITTWALD_SSH_PRIVATE_KEY }}
          MITTWALD_SSH_HOST_KEY: ${{ secrets.MITTWALD_SSH_HOST_KEY }}
        run: |
          if [[ -z "${MITTWALD_SSH_PRIVATE_KEY}" ]]; then
            echo "Secret MITTWALD_SSH_PRIVATE_KEY fehlt."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MITTWALD_SSH_PRIVATE_KEY" > ~/.ssh/mittwald_deploy
          chmod 600 ~/.ssh/mittwald_deploy
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Optional vorausgefüllte Host-Keys (empfohlen von mittwald)
          if [[ -n "${MITTWALD_SSH_HOST_KEY}" ]]; then
            printf '%s\n' "$MITTWALD_SSH_HOST_KEY" >> ~/.ssh/known_hosts
          fi

          # CI kennt mittwald-Hosts sonst nicht → "Host key verification failed"
          cat > ~/.ssh/config <<'EOF'
Host *.project.host
  StrictHostKeyChecking accept-new
  UserKnownHostsFile ~/.ssh/known_hosts
  IdentityFile ~/.ssh/mittwald_deploy
  IdentitiesOnly yes
EOF
          chmod 600 ~/.ssh/config

          # Bekannter SSH-Host der Testinstallation (Amateurhandball / a-gpdufg)
          ssh-keyscan -T 15 -H ssh.lashorst.project.host >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          echo "MITTWALD_SSH_IDENTITY_FILE=$HOME/.ssh/mittwald_deploy" >> "$GITHUB_ENV"

      - name: Deploy theme
        env:
          MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
        run: |
          if [[ -z "${MITTWALD_API_TOKEN}" ]]; then
            echo "Secret MITTWALD_API_TOKEN fehlt."
            exit 1
          fi
          ZIP="dist/${{ needs.package.outputs.zip_name }}"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ./ops/scripts/deploy-shops.sh "$ZIP" --dry-run
          else
            ./ops/scripts/deploy-shops.sh "$ZIP"
          fi
